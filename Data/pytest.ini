[pytest]
testpaths = tests
# Тесты Data-трека не ходят в сеть и не поднимают браузер: всё, что этого требует,
# помечается `slow` и по умолчанию не запускается (`-m slow` — запустить только их).
markers =
    slow: требует сети, Chromium или собранных наборов
addopts = -m "not slow" --strict-markers
