<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Real Estate Website</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Styles */
        header {
            background-color: #fff;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-form {
            flex: 1;
            max-width: 400px;
        }

        .search-form input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .search-form input::placeholder {
            color: #999;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-menu a {
            text-decoration: none;
            color: #8040ff;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: #6020cc;
        }

        /* Main Content */
        main {
            padding: 40px 0;
            background-color: #f8f9fa;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .hero-image {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 400px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .properties-section h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #333;
        }

        .properties-list {
            list-style: none;
        }

        .properties-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .properties-list li:last-child {
            border-bottom: none;
        }

        /* Footer */
        footer {
            background-color: #fff;
            padding: 40px 0;
            margin-top: 40px;
            border-top: 1px solid #eee;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-info {
            text-align: left;
        }

        .footer-info p {
            margin: 5px 0;
        }

        .social-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .social-links a {
            text-decoration: none;
            color: #8040ff;
            font-weight: 500;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #6020cc;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            .main-content {
                grid-template-columns: 1fr;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .nav-menu {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<header>
<div class="container">
<div class="header-content">
<form class="search-form">
<input placeholder="Search properties..." type="text"/>
</form>
<nav>
<ul class="nav-menu">
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>
</div>
</div>
</header>
<main>
<div class="container">
<div class="main-content">
<div class="hero-image">
<div>
<svg fill="none" height="100" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="100">
<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
</div>
</div>
<div class="properties-section">
<h2>Properties for Sale</h2>
<ul class="properties-list">
<li>123 Main St, Anytown USA</li>
<li>456 Oak St, Anytown USA</li>
<li>789 Pine St, Anytown USA</li>
</ul>
</div>
</div>
</div>
</main>
<footer>
<div class="container">
<div class="footer-content">
<div class="footer-info">
<p>123 Real Estate St, Anytown USA</p>
<p>(123) 456-7890</p>
</div>
<div class="social-links">
<ul>
<li><a href="#">Facebook</a></li>
<li><a href="#">Twitter</a></li>
<li><a href="#">Instagram</a></li>
</ul>
</div>
</div>
</div>
</footer>
</body>
</html>
