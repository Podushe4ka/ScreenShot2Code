<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Product Page</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Styles */
        header {
            background-color: #fff;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-size: 16px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #333;
        }

        /* Main Content */
        main {
            padding: 40px 0;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 40px;
        }

        /* Sidebar */
        .sidebar {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .sidebar h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .filter-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .product-actions {
            margin-top: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #555;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<header>
<div class="container">
<div class="header-content">
<div class="logo">Company Logo</div>
<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>
</div>
</div>
</header>
<main>
<div class="container">
<div class="content-grid">
<aside class="sidebar">
<h3>Product Filters</h3>
<div class="filter-group">
<label for="category">Category</label>
<select id="category">
<option value="">All Categories</option>
<option value="electronics">Electronics</option>
<option value="clothing">Clothing</option>
<option value="home">Home &amp; Garden</option>
</select>
</div>
<div class="filter-group">
<label for="price">Price Range</label>
<select id="price">
<option value="">All Prices</option>
<option value="low">Under $50</option>
<option value="medium">$50 - $150</option>
<option value="high">Over $150</option>
</select>
</div>
</aside>
<section class="product-section">
<h2>Featured Products</h2>
<div class="product-grid">
<div class="product-card">
<div class="product-image">
<div style="width: 100%; height: 100%; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
<span style="color: #999;">Product Image</span>
</div>
</div>
<div class="product-info">
<h3 class="product-title">Product Name 1</h3>
<div class="product-price">$99.99</div>
<div class="product-actions">
<a class="btn" href="#">Add to Cart</a>
</div>
</div>
</div>
<div class="product-card">
<div class="product-image">
<div style="width: 100%; height: 100%; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
<span style="color: #999;">Product Image</span>
</div>
</div>
<div class="product-info">
<h3 class="product-title">Product Name 2</h3>
<div class="product-price">$149.99</div>
<div class="product-actions">
<a class="btn" href="#">Add to Cart</a>
</div>
</div>
</div>
<div class="product-card">
<div class="product-image">
<div style="width: 100%; height: 100%; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
<span style="color: #999;">Product Image</span>
</div>
</div>
<div class="product-info">
<h3 class="product-title">Product Name 3</h3>
<div class="product-price">$79.99</div>
<div class="product-actions">
<a class="btn" href="#">Add to Cart</a>
</div>
</div>
</div>
<div class="product-card">
<div class="product-image">
<div style="width: 100%; height: 100%; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
<span style="color: #999;">Product Image</span>
</div>
</div>
<div class="product-info">
<h3 class="product-title">Product Name 4</h3>
<div class="product-price">$199.99</div>
<div class="product-actions">
<a class="btn" href="#">Add to Cart</a>
</div>
</div>
</div>
</div>
</section>
</div>
</div>
</main>
</body>
</html>
