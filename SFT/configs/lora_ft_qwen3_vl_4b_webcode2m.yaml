# WebCode2M LoRA-конфиг (Qwen3-VL-4B). Отдельный от WebSight, потому что реальные
# страницы длиннее: код median ~4131, p99 ~9646 токенов. max_length выставлен в
# ПОТОЛОК окна модели 8192 (выше нельзя) — длинный хвост кода трейнер сам отбракует
# по длине. Микробатч мал (2), т.к. при seqlen 8192 логиты лосса (bs*seqlen*vocab,
# fp32) доминируют по памяти; эффективный батч добираем grad_accum.
# ВНИМАНИЕ: max_pixels в процессоре пока не клэмпит, поэтому датасет ОБЯЗАТЕЛЬНО
# прогнать через height-фильтр (см. Data/drafting/filter_by_height.py), иначе
# высокие реальные страницы уронят vision-башню.
model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
model_revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
dtype: bfloat16
attn_implementation: flash_attention_2
dataset_num_proc: 16
remove_unused_columns: false
dataset_train_split: train
dataset_test_split: validation
dataloader_num_workers: 8
tf32: true
num_train_epochs: 3
warmup_ratio: 0.03
optim: adamw_torch_fused
lr_scheduler_type: cosine
seed: 42
logging_steps: 10
eval_strategy: steps
eval_steps: 0.25
save_strategy: steps
save_steps: 0.2
save_total_limit: 2
save_only_model: true
bf16: true
fp16: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
report_to: none
max_length: 8192
output_dir: sft-output/lora_ft_qwen3_vl_4b_webcode2m
run_name: lora_ft_qwen3_vl_4b_webcode2m
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 0.0002
weight_decay: 0.01
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
