[project]
name = "sft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    # SaaS app.clear.ml -> сервер 2.x. Чистый py3-wheel, от torch/CUDA не зависит.
    "clearml>=2.1,<3",
    "datasets>=4.7,<5",
    "deepspeed>=0.19.2",
    "numpy>=2.5.1",
    "peft>=0.18.1",       
    "qwen-vl-utils>=0.0.14",
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "transformers>=5.13,<6",
    "trl>=1.8,<2",       
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[project.optional-dependencies]
gpu = [
    "flash-attn>=2.0.0",
    "causal-conv1d>=1.4",
    "flash-linear-attention[cuda]>=0.5.1",
    "triton>=3.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
